<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <rect x="0.5" y="0.5" width="959" height="579" rx="10" fill="#ffffff" stroke="#e5e5e5"/>

  <text x="480" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">推理耗时对比：原生 Transformers vs vLLM 容器化加速（单位 ms，越短越好）</text>

  <!-- legend -->
  <rect x="330" y="46" width="14" height="14" rx="3" fill="#f87171"/>
  <text x="350" y="58" font-size="12.5" fill="#444">原生 Transformers（基线）</text>
  <rect x="540" y="46" width="14" height="14" rx="3" fill="#0070f3"/>
  <text x="560" y="58" font-size="12.5" fill="#444">vLLM 容器化 + 推测并发</text>

  <!-- grid -->
  <g stroke="#e5e5e5" stroke-dasharray="3 4" stroke-width="1">
    <line x1="260" y1="72" x2="260" y2="512"/>
    <line x1="362" y1="72" x2="362" y2="512"/>
    <line x1="464" y1="72" x2="464" y2="512"/>
    <line x1="566" y1="72" x2="566" y2="512"/>
    <line x1="668" y1="72" x2="668" y2="512"/>
    <line x1="770" y1="72" x2="770" y2="512"/>
  </g>
  <g font-size="11.5" fill="#999" text-anchor="middle">
    <text x="260" y="528">0</text><text x="362" y="528">1,000</text><text x="464" y="528">2,000</text>
    <text x="566" y="528">3,000</text><text x="668" y="528">4,000</text><text x="770" y="528">5,000</text>
  </g>

  <!-- G1 Stage 1 -->
  <text x="245" y="112" text-anchor="end" font-size="13" fill="#1a1a1a">Stage 1 · 4 帧时序分类</text>
  <rect x="260" y="82" width="438" height="30" rx="5" fill="#f87171"/>
  <text x="706" y="102" font-size="13" fill="#991b1b">4,300 ms</text>
  <rect x="260" y="118" width="104" height="30" rx="5" fill="#0070f3"/>
  <text x="372" y="138" font-size="13" fill="#1e40af">1,023 ms</text>
  <rect x="448" y="119" width="50" height="28" rx="14" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="473" y="138" text-anchor="middle" font-size="12.5" font-weight="700" fill="#16a34a">4.2×</text>

  <!-- G2 Stage 2 normal -->
  <text x="245" y="227" text-anchor="end" font-size="13" fill="#1a1a1a">Stage 2 · 单图定位（正常）</text>
  <rect x="260" y="197" width="122" height="30" rx="5" fill="#f87171"/>
  <text x="390" y="217" font-size="13" fill="#991b1b">1,200 ms</text>
  <rect x="260" y="233" width="8" height="30" rx="3" fill="#0070f3"/>
  <text x="276" y="253" font-size="13" fill="#1e40af">81 ms</text>
  <rect x="330" y="234" width="50" height="28" rx="14" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="355" y="253" text-anchor="middle" font-size="12.5" font-weight="700" fill="#16a34a">14.8×</text>

  <!-- G3 Stage 2 foreign -->
  <text x="245" y="342" text-anchor="end" font-size="13" fill="#1a1a1a">Stage 2 · 单图定位（异物）</text>
  <rect x="260" y="312" width="356" height="30" rx="5" fill="#f87171"/>
  <text x="624" y="332" font-size="13" fill="#991b1b">3,500 ms</text>
  <rect x="260" y="348" width="55" height="30" rx="5" fill="#0070f3"/>
  <text x="323" y="368" font-size="13" fill="#1e40af">543 ms</text>
  <rect x="392" y="349" width="50" height="28" rx="14" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="417" y="368" text-anchor="middle" font-size="12.5" font-weight="700" fill="#16a34a">6.4×</text>

  <!-- G4 end-to-end -->
  <text x="245" y="457" text-anchor="end" font-size="13.5" font-weight="700" fill="#1a1a1a">端到端 · 单窗口稳态均值</text>
  <rect x="260" y="427" width="560" height="30" rx="5" fill="#dc2626"/>
  <text x="828" y="447" font-size="13.5" font-weight="700" fill="#991b1b">5,500 ms</text>
  <rect x="260" y="463" width="109" height="30" rx="5" fill="#0070f3"/>
  <text x="377" y="483" font-size="13.5" font-weight="700" fill="#1e40af">1,068 ms</text>
  <rect x="470" y="464" width="54" height="28" rx="14" fill="#16a34a"/>
  <text x="497" y="483" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">5.1×</text>

  <!-- annotations -->
  <text x="262" y="78" font-size="11" fill="#999">◀ 远超 4 s 视频窗口，实时性破产</text>
  <text x="480" y="558" text-anchor="middle" font-size="12.5" fill="#666">优化组合拳：PagedAttention 显存虚拟化 + 连续批处理 + CUDAGraph 静态图 + 推测并发 T = max(S1, S2)</text>
  <text x="480" y="576" text-anchor="middle" font-size="12" fill="#999">测试环境：NVIDIA TITAN RTX 24GB · Driver 595.84 / CUDA 13.2 · 10 分钟典型视频 foreign_1.mp4</text>
</svg>
