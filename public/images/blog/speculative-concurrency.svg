<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="a6s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="a6d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0070f3"/>
    </marker>
    <marker id="a6g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="659" rx="10" fill="#ffffff" stroke="#e5e5e5"/>

  <text x="480" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">推测并发（Speculative Concurrency）：赌 99% 的画面是正常的</text>

  <!-- lifeline headers -->
  <g>
    <rect x="90" y="48" width="140" height="40" rx="8" fill="#1a1a1a"/>
    <text x="160" y="73" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">主调度器 Main</text>
    <rect x="330" y="48" width="140" height="40" rx="8" fill="#f6f8fa" stroke="#9ca3af"/>
    <text x="400" y="73" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a1a1a">线程池 Executor</text>
    <rect x="570" y="48" width="140" height="40" rx="8" fill="#eff6ff" stroke="#0070f3"/>
    <text x="640" y="73" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e40af">vLLM :8000</text>
    <rect x="780" y="48" width="150" height="40" rx="8" fill="#fffbeb" stroke="#d97706"/>
    <text x="855" y="73" text-anchor="middle" font-size="13.5" font-weight="700" fill="#92400e">时序追踪器</text>
  </g>

  <!-- lifelines -->
  <g stroke="#d0d7de" stroke-dasharray="4 4" stroke-width="1.2">
    <line x1="160" y1="88" x2="160" y2="450"/>
    <line x1="400" y1="88" x2="400" y2="450"/>
    <line x1="640" y1="88" x2="640" y2="450"/>
    <line x1="855" y1="88" x2="855" y2="450"/>
  </g>

  <!-- messages -->
  <text x="76" y="122" font-size="12" fill="#666">⏱ 同时发射</text>
  <line x1="160" y1="126" x2="400" y2="126" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a6s)"/>
  <text x="280" y="118" text-anchor="middle" font-size="12.5" fill="#1a1a1a">派发 Stage 1（4 帧时序分类）</text>
  <line x1="160" y1="152" x2="400" y2="152" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a6s)"/>
  <text x="280" y="144" text-anchor="middle" font-size="12.5" fill="#1a1a1a">派发 Stage 2（末帧单图定位）</text>

  <line x1="400" y1="196" x2="640" y2="196" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a6s)"/>
  <text x="520" y="188" text-anchor="middle" font-size="12.5" fill="#1a1a1a">HTTP 并发请求 × 2（Continuous Batching 合批）</text>

  <line x1="640" y1="238" x2="400" y2="238" stroke="#0070f3" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a6d)"/>
  <text x="520" y="230" text-anchor="middle" font-size="12.5" fill="#0070f3">S1 结果返回（~1.0 s）</text>
  <line x1="640" y1="264" x2="400" y2="264" stroke="#0070f3" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a6d)"/>
  <text x="520" y="256" text-anchor="middle" font-size="12.5" fill="#0070f3">S2 结果几乎同时返回</text>

  <line x1="400" y1="298" x2="160" y2="298" stroke="#0070f3" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a6d)"/>
  <text x="280" y="290" text-anchor="middle" font-size="12.5" fill="#0070f3">S1_res + S2_res，墙钟耗时 ≈ max(S1, S2)</text>

  <!-- gate arbiter frame -->
  <rect x="60" y="330" width="880" height="112" rx="10" fill="none" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="76" y="318" width="180" height="24" rx="6" fill="#f6f8fa" stroke="#9ca3af"/>
  <text x="166" y="335" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">门控仲裁 Gate Arbiter</text>

  <rect x="84" y="352" width="440" height="26" rx="6" fill="#fef2f2"/>
  <text x="96" y="370" font-size="12.5" fill="#b91c1c">① S1 报【脏污 dirt=1】→ 丢弃 S2，直接判定画面脏污 🌫️</text>
  <rect x="84" y="384" width="440" height="26" rx="6" fill="#fffbeb"/>
  <text x="96" y="402" font-size="12.5" fill="#b45309">② S1 报【火花 spk=1】→ 触发火花 Box 定位 🔥</text>
  <rect x="84" y="416" width="440" height="26" rx="6" fill="#f0fdf4"/>
  <text x="96" y="434" font-size="12.5" fill="#166534">③ S1 报【正常】（99% 工况）→ 采纳 S2 异物坐标 ✅</text>

  <line x1="160" y1="429" x2="855" y2="429" stroke="#16a34a" stroke-width="1.8" marker-end="url(#a6g)"/>
  <text x="508" y="447" text-anchor="middle" font-size="12" fill="#16a34a">坐标送入跨窗口时序追踪器复核（见系列二 §三）</text>

  <!-- bottom comparison -->
  <rect x="60" y="474" width="380" height="92" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="250" y="506" text-anchor="middle" font-size="13.5" font-weight="700" fill="#666">传统串行级联</text>
  <text x="250" y="534" text-anchor="middle" font-size="15" font-family="Menlo,Consolas,monospace" fill="#1a1a1a">T = S1 + S2 ≈ 2.0 s</text>
  <text x="250" y="556" text-anchor="middle" font-size="12" fill="#999">等 S1 出结果，再决定是否跑 S2</text>

  <path d="M 456 520 L 484 520" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#a6g)"/>
  <text x="470" y="506" text-anchor="middle" font-size="12.5" font-weight="700" fill="#16a34a">↓</text>

  <rect x="500" y="474" width="400" height="92" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="700" y="506" text-anchor="middle" font-size="13.5" font-weight="700" fill="#16a34a">推测并发（本文方案）</text>
  <text x="700" y="534" text-anchor="middle" font-size="15" font-family="Menlo,Consolas,monospace" fill="#1a1a1a">T = max(S1, S2) ≈ 1.0 s</text>
  <text x="700" y="556" text-anchor="middle" font-size="12" fill="#16a34a">端到端稳态实测 1,068 ms（提速超 5 倍）</text>

  <text x="480" y="602" text-anchor="middle" font-size="12.5" fill="#666">赌注：99% 窗口画面正常 → S2 的投机计算几乎不浪费；代价：1% 异常窗口多算一次 S2（被门控丢弃）</text>
  <text x="480" y="626" text-anchor="middle" font-size="12" fill="#999">与 CPU 的分支预测 / 投机执行同构：预测成功赚时间，预测失败付小代价</text>
</svg>
