<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <!-- 背景卡片 -->
  <rect x="0.5" y="0.5" width="959" height="589" rx="10" fill="#ffffff" stroke="#e5e5e5"/>

  <!-- 主标题与副标题 -->
  <text x="480" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">受电弓检测层各组件推理耗时对比：PyTorch 原生 vs TensorRT FP16（单位 ms，越短越好）</text>

  <!-- 图例 Legend -->
  <rect x="290" y="46" width="14" height="14" rx="3" fill="#f87171"/>
  <text x="310" y="58" font-size="12.5" fill="#444">优化前基准 (PyTorch / CPU)</text>
  <rect x="520" y="46" width="14" height="14" rx="3" fill="#0284c7"/>
  <text x="540" y="58" font-size="12.5" fill="#444">优化后 (TensorRT FP16 / GPU)</text>

  <!-- 网格标尺 (0 ~ 50 ms, x 从 240 到 840, 跨度 600px, 12px/ms) -->
  <g stroke="#f0f0f0" stroke-width="1">
    <line x1="240" y1="72" x2="240" y2="495"/>
    <line x1="360" y1="72" x2="360" y2="495"/>
    <line x1="480" y1="72" x2="480" y2="495"/>
    <line x1="600" y1="72" x2="600" y2="495"/>
    <line x1="720" y1="72" x2="720" y2="495"/>
    <line x1="840" y1="72" x2="840" y2="495"/>
  </g>
  <g font-size="11.5" fill="#999" text-anchor="middle">
    <text x="240" y="512">0 ms</text>
    <text x="360" y="512">10 ms</text>
    <text x="480" y="512">20 ms</text>
    <text x="600" y="512">30 ms</text>
    <text x="720" y="512">40 ms</text>
    <text x="840" y="512">50 ms</text>
  </g>

  <!-- 33.33ms (30 FPS) 硬实时红虚线 (x = 240 + 33.33 * 12 = 640) -->
  <line x1="640" y1="68" x2="640" y2="495" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 4"/>
  <rect x="580" y="70" width="120" height="20" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
  <text x="640" y="84" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">33.33 ms (30 FPS 死线)</text>

  <!-- G1: YOLOv11 (大火花/受电弓) -->
  <text x="225" y="117" text-anchor="end" font-size="13" font-weight="600" fill="#1a1a1a">YOLOv11 逐帧检测</text>
  <!-- 基线: 11.36 ms (136.3px) -->
  <rect x="240" y="96" width="136" height="24" rx="4" fill="#f87171"/>
  <text x="384" y="113" font-size="12" fill="#991b1b">11.36 ms</text>
  <!-- TRT: 5.61 ms (67.3px) -->
  <rect x="240" y="124" width="67" height="24" rx="4" fill="#0284c7"/>
  <text x="315" y="141" font-size="12" font-weight="600" fill="#0369a1">5.61 ms</text>
  <!-- 加速胶囊 -->
  <rect x="445" y="122" width="56" height="26" rx="13" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="473" y="139" text-anchor="middle" font-size="12" font-weight="700" fill="#16a34a">2.03×</text>

  <!-- G2: HRNet-W32 (4点姿态解算) -->
  <text x="225" y="197" text-anchor="end" font-size="13" font-weight="600" fill="#1a1a1a">HRNet-W32 姿态解算</text>
  <!-- 基线: 44.10 ms (529.2px) 击穿红线 -->
  <rect x="240" y="176" width="529" height="24" rx="4" fill="#ef4444"/>
  <text x="777" y="193" font-size="12" font-weight="700" fill="#b91c1c">44.10 ms (超标卡顿)</text>
  <!-- TRT: 22.43 ms (269.2px) -->
  <rect x="240" y="204" width="269" height="24" rx="4" fill="#0284c7"/>
  <text x="517" y="221" font-size="12" font-weight="600" fill="#0369a1">22.43 ms (安全落入预算)</text>
  <!-- 加速胶囊 -->
  <rect x="670" y="203" width="56" height="26" rx="13" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="698" y="220" text-anchor="middle" font-size="12" font-weight="700" fill="#16a34a">1.97×</text>

  <!-- G3: FastAD 预处理 (2048x1536) -->
  <text x="225" y="277" text-anchor="end" font-size="13" font-weight="600" fill="#1a1a1a">FastAD 图像预处理</text>
  <!-- 基线: 6.80 ms (81.6px) -->
  <rect x="240" y="256" width="82" height="24" rx="4" fill="#f87171"/>
  <text x="330" y="273" font-size="12" fill="#991b1b">6.80 ms (CPU)</text>
  <!-- GPU: 2.03 ms (24.4px) -->
  <rect x="240" y="284" width="24" height="24" rx="3" fill="#0284c7"/>
  <text x="272" y="301" font-size="12" font-weight="600" fill="#0369a1">2.03 ms (GPU DMA+Area)</text>
  <!-- 加速胶囊 -->
  <rect x="445" y="283" width="56" height="26" rx="13" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="473" y="300" text-anchor="middle" font-size="12" font-weight="700" fill="#16a34a">3.35×</text>

  <!-- G4: FastAD 骨干 (WideResNet-50) -->
  <text x="225" y="357" text-anchor="end" font-size="13" font-weight="600" fill="#1a1a1a">FastAD 骨干特征提取</text>
  <!-- 基线: 6.92 ms (83.0px) -->
  <rect x="240" y="336" width="83" height="24" rx="4" fill="#f87171"/>
  <text x="331" y="353" font-size="12" fill="#991b1b">6.92 ms (68.9M 参数)</text>
  <!-- 剪枝版: 0.42 ms (5.0px) -->
  <rect x="240" y="364" width="8" height="24" rx="2" fill="#0284c7"/>
  <text x="256" y="381" font-size="12" font-weight="600" fill="#0369a1">0.42 ms (4.1M 参数 · 94% 剪枝)</text>
  <!-- 加速胶囊 -->
  <rect x="445" y="363" width="64" height="26" rx="13" fill="#16a34a"/>
  <text x="477" y="380" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">16.40×</text>

  <!-- G5: FastAD 端到端度量 -->
  <text x="225" y="437" text-anchor="end" font-size="13" font-weight="600" fill="#1a1a1a">FastAD 端到端单模型</text>
  <!-- 基线: 34.26 ms (411.1px) -->
  <rect x="240" y="416" width="411" height="24" rx="4" fill="#f87171"/>
  <text x="660" y="433" font-size="12" fill="#991b1b">34.26 ms</text>
  <!-- 优化后: 19.94 ms (239.3px) -->
  <rect x="240" y="444" width="239" height="24" rx="4" fill="#0284c7"/>
  <text x="487" y="461" font-size="12" font-weight="600" fill="#0369a1">19.94 ms</text>
  <!-- 加速胶囊 -->
  <rect x="555" y="443" width="56" height="26" rx="13" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="583" y="460" text-anchor="middle" font-size="12" font-weight="700" fill="#16a34a">1.72×</text>

  <!-- 底部注记与环境说明 -->
  <text x="480" y="545" text-anchor="middle" font-size="12" fill="#666">核心成效：HRNet-W32 (22.43ms) 与 FastAD (19.94ms) 双双进入 33.33ms 预算安全区，逐帧 YOLO 压至 5.61ms 释放 78.1% 裕量</text>
  <text x="480" y="565" text-anchor="middle" font-size="11.5" fill="#999">测试平台：NVIDIA TITAN RTX (24GB) · FP16 模式 · 输入分辨率：YOLO (640x640), HRNet (288x384), FastAD (256x256)</text>
</svg>
