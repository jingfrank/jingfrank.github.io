<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <!-- Card Background -->
  <rect x="0.5" y="0.5" width="959" height="549" rx="10" fill="#ffffff" stroke="#e5e5e5"/>

  <!-- Title & Subtitle -->
  <text x="480" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">边缘端硬件视频编码性能基准对比：软编保底 vs 极速软编 vs 全硬件零拷贝</text>
  <text x="480" y="56" text-anchor="middle" font-size="12" fill="#666">测试平台：NVIDIA Jetson AGX Orin 64GB · 1080P@30FPS 视频切片落盘（数值越低越好）</text>

  <!-- Legend -->
  <g transform="translate(190, 72)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#f87171"/>
    <text x="20" y="12" font-size="12" fill="#444">软编兜底 (FFmpeg mp4v)</text>

    <rect x="200" y="0" width="14" height="14" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="2 2"/>
    <text x="220" y="12" font-size="12" fill="#444">极速软编 (x264enc 试验预留)</text>

    <rect x="420" y="0" width="14" height="14" rx="3" fill="#10b981"/>
    <text x="440" y="12" font-size="12" fill="#444">全硬件零拷贝 (nvv4l2h264enc + NVMM)</text>
  </g>

  <!-- Section 1: 单帧编码耗时 -->
  <g transform="translate(0, 110)">
    <text x="235" y="44" text-anchor="end" font-size="13.5" font-weight="600" fill="#1a1a1a">单帧平均耗时 (ms)</text>
    
    <!-- mp4v -->
    <rect x="250" y="10" width="480" height="24" rx="4" fill="#f87171"/>
    <text x="738" y="27" font-size="12.5" font-weight="600" fill="#991b1b">129.2 ms</text>

    <!-- x264enc -->
    <rect x="250" y="40" width="160" height="24" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="3 3"/>
    <text x="418" y="57" font-size="12" fill="#64748b">待实测数据接入 (TBD)</text>

    <!-- NVMM -->
    <rect x="250" y="70" width="100" height="24" rx="4" fill="#10b981"/>
    <text x="358" y="87" font-size="12.5" font-weight="700" fill="#065f46">26.9 ms</text>

    <!-- Badge -->
    <rect x="520" y="68" width="68" height="26" rx="13" fill="#ecfdf5" stroke="#10b981"/>
    <text x="554" y="86" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">4.8× 提速</text>
  </g>

  <!-- Divider Line 1 -->
  <line x1="80" y1="225" x2="880" y2="225" stroke="#f1f5f9" stroke-width="1.5"/>

  <!-- Section 2: 200+ 帧切片总落盘时延 -->
  <g transform="translate(0, 240)">
    <text x="235" y="44" text-anchor="end" font-size="13.5" font-weight="600" fill="#1a1a1a">200+ 帧总时延 (s)</text>
    
    <!-- mp4v -->
    <rect x="250" y="10" width="480" height="24" rx="4" fill="#f87171"/>
    <text x="738" y="27" font-size="12.5" font-weight="600" fill="#991b1b">26.75 s (排队严重)</text>

    <!-- x264enc -->
    <rect x="250" y="40" width="160" height="24" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="3 3"/>
    <text x="418" y="57" font-size="12" fill="#64748b">待实测数据接入 (TBD)</text>

    <!-- NVMM -->
    <rect x="250" y="70" width="124" height="24" rx="4" fill="#10b981"/>
    <text x="382" y="87" font-size="12.5" font-weight="700" fill="#065f46">6.91 s</text>

    <!-- Badge -->
    <rect x="520" y="68" width="98" height="26" rx="13" fill="#ecfdf5" stroke="#10b981"/>
    <text x="569" y="86" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">时延压缩 74.2%</text>
  </g>

  <!-- Divider Line 2 -->
  <line x1="80" y1="355" x2="880" y2="355" stroke="#f1f5f9" stroke-width="1.5"/>

  <!-- Section 3: 单路 CPU 核心占用率 -->
  <g transform="translate(0, 370)">
    <text x="235" y="44" text-anchor="end" font-size="13.5" font-weight="600" fill="#1a1a1a">单路 CPU 占用率 (%)</text>
    
    <!-- mp4v -->
    <rect x="250" y="10" width="480" height="24" rx="4" fill="#ef4444"/>
    <text x="738" y="27" font-size="12.5" font-weight="600" fill="#991b1b">380% ~ 480% (占满4核+)</text>

    <!-- x264enc -->
    <rect x="250" y="40" width="220" height="24" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="3 3"/>
    <text x="478" y="57" font-size="12" fill="#64748b">待实测数据接入 (TBD)</text>

    <!-- NVMM -->
    <rect x="250" y="70" width="18" height="24" rx="4" fill="#10b981"/>
    <text x="276" y="87" font-size="12.5" font-weight="700" fill="#065f46">&lt; 2.8% (近乎零开销)</text>

    <!-- Badge -->
    <rect x="520" y="68" width="98" height="26" rx="13" fill="#ecfdf5" stroke="#10b981"/>
    <text x="569" y="86" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">CPU 释放 99%+</text>
  </g>

  <!-- Footer Annotations -->
  <g transform="translate(480, 500)">
    <text x="0" y="0" text-anchor="middle" font-size="12" fill="#475569">💡 核心机制：独立 NVENC 硬件卸载 · 32 位 BGRx 内存对齐 · (memory:NVMM) 物理显存零拷贝</text>
    <text x="0" y="20" text-anchor="middle" font-size="11" fill="#94a3b8">注：极速软编 (x264enc) 虚线栏为实验预留位，实测完成后即刻同步填入</text>
  </g>
</svg>
